<!doctype html>
<html lang="vi">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f6f0">
<title>Cây xăng gần bạn</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f0;color:#172d25;font:16px/1.5 system-ui,sans-serif}main{max-width:480px;margin:auto;padding:clamp(28px,8vh,76px) 20px 24px}header{margin-bottom:24px}.icon{display:grid;place-items:center;width:48px;height:48px;background:#dfeade;border-radius:15px;font-size:22px}h1{margin:12px 0 2px;font-size:clamp(28px,7vw,36px);letter-spacing:-.045em}p{margin:0;color:#52655a}#choices{display:grid;gap:10px}#choices a,.placeholder{min-height:72px;border-radius:16px;background:white;border:1px solid #dbe4d9}#choices a{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 16px;color:inherit;text-decoration:none}#choices a:active{background:#e3eee2}a:focus-visible,button:focus-visible{outline:3px solid #24704a;outline-offset:3px}.arrow{display:grid;place-items:center;width:34px;height:34px;flex:none;border-radius:50%;background:#e5eee2;color:#205f43}.placeholder{display:flex;align-items:center;padding:16px}.placeholder::before{content:'';width:55%;height:12px;border-radius:10px;background:#e7ece4}#status{margin-top:14px;font-size:14px}#status:empty{display:none}#actions{margin-top:14px;display:flex;align-items:center;flex-wrap:wrap;gap:14px}#actions[hidden]{display:none}button{min-height:46px;padding:0 15px;border:0;border-radius:10px;background:#245b42;color:white;font:inherit;cursor:pointer}a{color:#245b42}footer{margin-top:22px;font-size:12px;color:#586a60}
#choices article,#chat{background:#fff;border:1px solid #dbe4d9;border-radius:16px;padding:14px}
.comparison{display:grid;gap:6px}.comparison.best{border-color:#24704a}
#chat{margin-top:20px}#chat h2{margin:0 0 8px;font-size:19px}
.chat-prompts{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.chat-prompts button{background:#e9f1e7;color:#245b42;padding:8px 12px}
#messages{max-height:280px;overflow:auto}#messages p{white-space:pre-line;padding:10px;margin:8px 0;background:#f1f5ee;border-radius:10px}
#messages .user-message{background:#245b42;color:white;margin-left:20px}
form{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;margin-top:12px}
form label,#suggestions{grid-column:1/-1}input{min-width:0;font:inherit;padding:8px}
[hidden]{display:none!important}
</style>
<main>
<header><span class="icon" aria-hidden="true">⛽</span><h1>Cây xăng gần bạn</h1><p>Chọn một cây để mở Google Maps.</p></header>
<div id="choices" aria-busy="true"><div class="placeholder" aria-hidden="true"></div><div class="placeholder" aria-hidden="true"></div><div class="placeholder" aria-hidden="true"></div></div>
<p id="status" role="status">Đang lấy vị trí…</p>
<form id="manual" hidden><label for="address">Nhập vị trí xuất phát</label><input id="address" type="search" placeholder="Ví dụ: Lotte Tây Hồ, Cầu Giấy" required maxlength="200" autocomplete="off"><button type="submit">Tìm</button><div id="suggestions" aria-label="Địa điểm gợi ý"></div></form><div id="actions" hidden><button id="go" type="button">Thử lại</button><a id="maps-search" href="https://www.google.com/maps/search/?api=1&amp;query=c%C3%A2y+x%C4%83ng+g%E1%BA%A7n+%C4%91%C3%A2y">Tìm trên Google Maps ↗</a></div>
<footer>Thời gian đi từ Google Maps · Địa chỉ từ <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a></footer>
<section id="chat" hidden>
  <h2>Trợ lý tìm cây xăng</h2><p>Hỏi về thời gian đi, hàng chờ hoặc địa chỉ.</p><div class="chat-prompts"><button type="button">Cây nào đổ xong sớm nhất?</button><button type="button">Cây nào tới nhanh nhất?</button><button type="button">So sánh thời gian chờ</button></div>
  <div id="messages" role="log" aria-live="polite"></div>
  <form id="chat-form"><label for="question">Ví dụ: Cây nào đổ xong sớm nhất?</label><input id="question" required maxlength="500"><button>Gửi</button></form>
</section>
</main><script>
const button=document.getElementById('go'),statusText=document.getElementById('status'),actions=document.getElementById('actions');
const demoMode=new URLSearchParams(location.search).get('demo')==='1';
async function findStations(origin){
  if(demoMode){
    const fixtures=[
      {name:'Cây A · Đường lớn',address:'Đường lớn, Cầu Giấy (địa chỉ mẫu)',lat:21.035,lon:105.79,travelMinutes:4,distanceMeters:1100,speedKmh:16.5,delayMinutes:2,demoQueue:24,peak:true,serviceSlots:4,demoDensity:240,trafficDensityIndexPercent:60,trafficSampleCount:8,trafficQueueScaleVehicles:40,trafficEstimateConfidence:'demo'},
      {name:'Cây B · Khu dân cư',address:'Đường nhánh, Cầu Giấy (địa chỉ mẫu)',lat:21.03,lon:105.80,travelMinutes:7,distanceMeters:2200,speedKmh:18.9,delayMinutes:1,demoQueue:6,peak:true,serviceSlots:4,demoDensity:90,trafficDensityIndexPercent:20,trafficSampleCount:8,trafficQueueScaleVehicles:40,trafficEstimateConfidence:'demo'},
      {name:'Cây C · Gần nút giao',address:'Gần nút giao, Cầu Giấy (địa chỉ mẫu)',lat:21.04,lon:105.81,travelMinutes:9,distanceMeters:2600,speedKmh:17.3,delayMinutes:3,demoQueue:15,peak:true,serviceSlots:4,demoDensity:150,trafficDensityIndexPercent:40,trafficSampleCount:8,trafficQueueScaleVehicles:40,trafficEstimateConfidence:'demo'},
    ];
    return {stations:fixtures,summary:'Kịch bản giờ cao điểm. Mật độ đường và số xe chờ là hai giả định riêng.'};
  }
  if(location.protocol==='file:') throw Error('Mở app qua máy chủ tại http://127.0.0.1:8765.');
  const response=await fetch('/api/stations',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify(origin),
    signal:AbortSignal.timeout(30000),
  });
  const data=await response.json();
  if(!response.ok) throw Error(data.error || 'Chưa lấy được cây xăng.');
  return data;
}
const choices=document.getElementById('choices');
const manual=document.getElementById('manual');
const address=document.getElementById('address');
const mapsSearch=document.getElementById('maps-search');
const chat=document.getElementById('chat');
const chatForm=document.getElementById('chat-form');
const messages=document.getElementById('messages');
const questionInput=document.getElementById('question');
let chatOptions=[];
function localAnswer(question, options){
  const normalized=question.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d');
  const selected=options.find((option,index)=>normalized.includes('cay '+String.fromCharCode(97+index)));
  const hasTotals=options.every(option=>option.totalMinutes!=null);
  const useTotal=hasTotals&&!/toi nhanh|den nhanh|gan nhat|toi som/.test(normalized);
  const metric=useTotal?'totalMinutes':'travelMinutes';
  const ranked=[...options].sort((a,b)=>a[metric]-b[metric]);
  const describe=option=>option.name+' · '+(option.address||'Chưa có địa chỉ')+' · Đi '+option.travelMinutes+' phút'+(option.waitMinutes==null?' · Chưa rõ hàng chờ':' · '+option.crowd+' · Chờ khoảng '+option.waitMinutes+' phút · Đổ xong sau '+option.totalMinutes+' phút theo giả định');
  if(selected) return describe(selected);
  if(/dia chi|cho|dong|vang|so sanh/.test(normalized)) return ranked.map(describe).join('\n');
  return (useTotal?'Đổ xong sớm nhất theo kịch bản: ':'Tới sớm nhất theo ETA: ')+describe(ranked[0]);
}
chatForm.onsubmit=async event=>{
  event.preventDefault();
  const question=questionInput.value.trim();
  if(!question || !chatOptions.length) return;
  const stations=chatOptions.map(option=>({...option}));
  const submit=chatForm.querySelector('button');
  submit.disabled=true;
  const message=document.createElement('p');
  message.className='user-message';
  message.textContent=question;
  messages.append(message);
  const reply=document.createElement('p');
  reply.textContent='Đang trả lời…';
  messages.append(reply);
  questionInput.value='';
  try{
    if(demoMode || location.protocol==='file:') throw Error();
    const response=await fetch('/api/chat',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({question,stations}),signal:AbortSignal.timeout(8000),
    });
    if(!response.ok) throw Error();
    reply.textContent=(await response.json()).answer;
  }catch{
    reply.textContent=(demoMode?'Demo · ':'Trả lời từ số liệu trên màn hình · ')+localAnswer(question,stations);
  }finally{
    submit.disabled=false;
    messages.scrollTop=messages.scrollHeight;
  }
};
chat.querySelectorAll('.chat-prompts button').forEach(button=>{
  button.onclick=()=>{
    if(chatForm.querySelector('button').disabled) return;
    questionInput.value=button.textContent;
    chatForm.requestSubmit();
  };
});
async function loadStations(query, selectedOrigin){
  chat.hidden=true;
  chatOptions=[];
  messages.replaceChildren();
  manual.querySelector('button').disabled=true;
  actions.hidden=true;
  choices.setAttribute('aria-busy','true');
  try{
    const searchUrl=new URL('https://www.google.com/maps/search/');
    searchUrl.search=new URLSearchParams({api:'1',query:query?'cây xăng gần '+query:'cây xăng gần đây'});
    mapsSearch.href=searchUrl.toString();
    let origin;
    if(demoMode){
      origin={lat:21.03,lon:105.79};
    }else if(selectedOrigin){
      origin=selectedOrigin;
    }else if(query){
      statusText.textContent='Đang tìm địa chỉ…';
      const url=new URL('https://photon.komoot.io/api/');
      url.search=new URLSearchParams({q:query,limit:'1',lat:'21.0285',lon:'105.8542'});
      const response=await fetch(url,{signal:AbortSignal.timeout(8000)});
      if(!response.ok) throw Error('Chưa tra được địa chỉ. Hãy thử lại.');
      const data=await response.json();
      const coordinates=data.features?.[0]?.geometry?.coordinates;
      if(!coordinates || !coordinates.every(Number.isFinite)) throw Error('Chưa tìm thấy địa chỉ. Hãy thêm tên quận hoặc thành phố.');
      const [lon,lat]=coordinates;
      origin={lat,lon};
    }else{
      if(!navigator.geolocation) throw Error('Hãy nhập địa chỉ để tìm cây xăng.');
      statusText.textContent='Đang lấy vị trí…';
      const position=await new Promise((resolve,reject)=>navigator.geolocation.getCurrentPosition(resolve,reject,{timeout:8000,maximumAge:120000}));
      origin={lat:position.coords.latitude,lon:position.coords.longitude};
    }
    statusText.textContent='Đang tìm cây xăng quanh bạn…';
    const {stations,summary}=await findStations(origin);
    if(!stations.length) throw Error('Chưa tìm thấy cây xăng cách điểm xuất phát dưới 3 km.');
    chatOptions=stations.map(({name,address,travelMinutes,arrivalAt,peak,serviceSlots,queueSource,distanceMeters,speedKmh,delayMinutes,trafficDensityIndexPercent,trafficJamFactor,trafficRoads,trafficSourceUpdated,trafficSampleCount,trafficQueueScaleVehicles,trafficEstimateConfidence})=>({name,address,arrivalAt,peak,serviceSlots,queueSource,distanceMeters,speedKmh,delayMinutes,trafficDensityIndexPercent,trafficJamFactor,trafficRoads,trafficSourceUpdated,trafficSampleCount,trafficQueueScaleVehicles,trafficEstimateConfidence,travelMinutes:Number(travelMinutes.toFixed(1)),waitMinutes:null,totalMinutes:null,crowd:null}));
    function compareTotals(){
      const cards=[...choices.querySelectorAll('.comparison')];
      const totals=cards.map(card=>Number(card.dataset.total));
      const complete=totals.length>1&&totals.every(Number.isFinite);
      const best=complete?Math.min(...totals):Infinity;
      cards.forEach((card,i)=>card.classList.toggle('best',complete&&totals[i]===best));
    }
    choices.replaceChildren(...stations.map((station,index)=>{
      const card=document.createElement('article');
      card.className='comparison';
      const street=document.createElement('small');
      street.textContent=station.address||'Chưa có địa chỉ';
      const metrics=document.createElement('small');
      const details=[];
      if(station.distanceMeters!=null) details.push((station.distanceMeters/1000).toLocaleString('vi-VN',{maximumFractionDigits:2})+' km');
      if(station.speedKmh!=null) details.push(station.speedKmh+' km/h');
      if(station.delayMinutes!=null) details.push('Chậm thêm '+station.delayMinutes+' phút');
      if(station.serviceSlots) details.push((station.peak?'Cao điểm':'Giờ thường')+' · '+station.serviceSlots+' xe cùng lúc');
      if(station.trafficDensityIndexPercent!=null) details.push('Chỉ số giao thông lân cận '+station.trafficDensityIndexPercent+'%');
      metrics.textContent=details.join(' · ');
      const field=document.createElement('label');
      field.textContent='Số xe chờ giả định';
      const queue=document.createElement('input');
      queue.type='number';
      queue.min='0';
      queue.step='1';
      queue.placeholder='?';
      if(demoMode) queue.value=station.demoQueue;
      else if(station.queueCount!=null) queue.value=station.queueCount;
      queue.setAttribute('aria-label','Số xe chờ giả định tại '+station.name);
      field.append(queue);
      field.hidden=true;
      const estimate=document.createElement('small');
      estimate.setAttribute('aria-live','polite');
      function update(){
        const count=queue.valueAsNumber;
        if(!Number.isInteger(count)||count<0){
          Object.assign(chatOptions[index],{queueCount:null,waitMinutes:null,totalMinutes:null,crowd:null});
          delete card.dataset.total;
          compareTotals();
          estimate.textContent='Mức đông và thời gian chờ: chưa rõ';
          return;
        }
        const wait=count/station.serviceSlots;
        card.dataset.total=station.travelMinutes+wait+1;
        compareTotals();
        const minutes=value=>value.toLocaleString('vi-VN',{maximumFractionDigits:1});
        const crowd=count<10?'Vắng':count<=20?'Vừa':'Đông';
        Object.assign(chatOptions[index],{crowd,queueCount:count,waitMinutes:Number(wait.toFixed(1)),totalMinutes:Number((station.travelMinutes+wait+1).toFixed(1))});
        const queueLabel=demoMode?'Số xe mẫu: ':'Hàng chờ ước tính: ~';
        const modelLabel=demoMode?' (mô phỏng)':' (từ giao thông đường tiếp cận; độ tin cậy thấp)';
        estimate.textContent=crowd+modelLabel+' · '+queueLabel+count+' xe · Chờ khoảng '+minutes(wait)+' phút · Đổ xong sau khoảng '+minutes(station.travelMinutes+wait+1)+' phút';
      }
      queue.oninput=update;
      update();
      const link=document.createElement('a');
      const url=new URL('https://www.google.com/maps/dir/');
      url.search=new URLSearchParams({api:'1',destination:station.lat+','+station.lon,travelmode:'two-wheeler',dir_action:'navigate'});
      if(query) url.searchParams.set('origin',origin.lat+','+origin.lon);
      if(station.id) url.searchParams.set('destination_place_id',station.id);
      link.href=url.toString();
      const name=document.createElement('strong');
      name.textContent=station.name+' · '+Math.ceil(station.travelMinutes)+' phút đi';
      const arrow=document.createElement('span');
      arrow.className='arrow';
      arrow.textContent='↗';
      arrow.setAttribute('aria-hidden','true');
      link.append(name,arrow);
      if(demoMode){
        card.append(name,street,metrics,field,estimate);
      }else{
        card.append(link,street,metrics,field,estimate);
      }
      const traffic=document.createElement('details');
      const heading=document.createElement('summary');
      heading.textContent='Cách ước tính giao thông lân cận';
      const note=document.createElement('small');
        note.textContent=station.trafficDensityIndexPercent==null
        ?'HERE chưa trả đủ 4 đoạn đường có dữ liệu quanh cây xăng. Chưa ước lượng hàng chờ.'
        :'HERE jamFactor trung bình '+(station.trafficJamFactor??'—')+'/10 trên '+station.trafficSampleCount+' đoạn đường. Đây là mức ùn tắc đường, không phải số xe ở cây xăng. Hàng chờ quy đổi theo heuristic: tối đa '+(station.trafficQueueScaleVehicles??40)+' xe.';
      const flow=document.createElement('p');
      flow.setAttribute('aria-live','polite');
      flow.textContent=station.trafficDensityIndexPercent==null
        ?'Nguồn: HERE Traffic API · chưa đủ dữ liệu đoạn đường.'
        :'Nguồn: HERE Traffic API · cập nhật '+(station.trafficSourceUpdated||'thời điểm không có')+' · Độ tin cậy hàng chờ: thấp';
      if(!demoMode&&Array.isArray(station.trafficRoads)&&station.trafficRoads.length){
        const roads=document.createElement('p');
        roads.textContent='Đường: '+station.trafficRoads.map(r=>(r.roadName||'Đoạn đường')+' (jam '+r.jamFactor+'/10)').join(' · ');
        traffic.append(heading,note,flow,roads);
      }else{
        traffic.append(heading,note,flow);
      }
      if(demoMode){
        traffic.open=true;
        note.textContent='Dữ liệu mẫu để xem giao diện; không phải quan sát giao thông thật.';
        flow.textContent='Chỉ số giao thông lân cận dùng trong demo: '+(station.trafficDensityIndexPercent??'chưa có')+'% · Hàng chờ là dữ liệu mẫu.';
      }
      card.append(traffic);
      return card;
    }));
    compareTotals();
    chat.hidden=false;
    statusText.textContent=summary||'Danh sách xếp theo thời gian đi.';
  }catch(error){
    statusText.textContent=error.code===1?'Hãy nhập địa chỉ hoặc khu vực để tìm cây xăng.':error.code===2||error.code===3?'Chưa xác định được vị trí. Bạn có thể nhập địa chỉ.':error.name==='TimeoutError'?'Tra địa chỉ quá lâu. Bạn có thể tìm trên Google Maps.':error instanceof TypeError?'Chưa kết nối được dịch vụ. Hãy thử lại.':error.message;
    choices.replaceChildren();
    manual.hidden=false;
    actions.hidden=false;
  } finally {
    manual.querySelector('button').disabled=false;
    choices.setAttribute('aria-busy','false');
  }
}
const suggestions=document.getElementById('suggestions');
let lookup;
let debounce;
function cancelLookup(){
  clearTimeout(debounce);
  lookup?.abort();
  suggestions.replaceChildren();
}
async function suggest(query){
  cancelLookup();
  const request=new AbortController();
  lookup=request;
  const timeout=setTimeout(()=>request.abort(),8000);
  const url=new URL('https://photon.komoot.io/api/');
  url.search=new URLSearchParams({q:query,limit:'5',lat:'21.0285',lon:'105.8542'});
  statusText.textContent='Đang tìm địa điểm…';
  try{
    const response=await fetch(url,{signal:request.signal});
    if(!response.ok) throw Error('search');
    const data=await response.json();
    if(request.signal.aborted || address.value.trim()!==query) return;
    const results=(data.features||[]).flatMap(feature=>{
      const [lon,lat]=feature.geometry?.coordinates||[];
      if(!Number.isFinite(lat)||!Number.isFinite(lon)) return [];
      const {name,street,housenumber,district,city,state}=feature.properties||{};
      const label=[...new Set([name,[housenumber,street].filter(Boolean).join(' '),district,city,state].filter(Boolean))].join(', ');
      return label?[{label,lat,lon}]:[];
    });
    for(const result of results){
      const choice=document.createElement('button');
      choice.type='button';
      choice.textContent=result.label;
      choice.onclick=()=>{
        cancelLookup();
        address.value=result.label;
        loadStations(result.label,{lat:result.lat,lon:result.lon});
      };
      suggestions.append(choice);
    }
    statusText.textContent=results.length?'Chọn vị trí xuất phát.':'Chưa thấy địa điểm. Hãy thêm tên quận hoặc thành phố.';
  }catch{
    if(lookup===request && address.value.trim()===query) statusText.textContent='Chưa tra được địa điểm. Hãy thử lại.';
  }finally{
    clearTimeout(timeout);
  }
}
address.oninput=()=>{
  cancelLookup();
  lookup=null;
  const query=address.value.trim();
  if(query.length>=3) debounce=setTimeout(()=>suggest(query),400);
};
button.onclick=()=>address.value.trim()?suggest(address.value.trim()):loadStations();
manual.onsubmit=event=>{
  event.preventDefault();
  const query=address.value.trim();
  if(query) suggest(query);
};
loadStations();
</script></html>
